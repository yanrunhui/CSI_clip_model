train:
  data_path: artifacts/d2los_coarse_k_balanced_train.pt
  output_dir: artifacts/pretrain_coarse_k_path_richness_aux
  save_every: 10
  batch_size: 128
  lr: 3.0e-4
  weight_decay: 1.0e-2
  epochs: 80
  temperature: 0.07
  use_power_branch: true
  warmup_epochs: 5
  min_lr: 1.0e-5
  csi_to_text_weight: 1.0
  prototype_weight: 1.0
  text_prototype_weight: 1.0
  text_mode: prototype
  prototype_warmup_epochs: 5
  semantic_classifier_weight: 0.5
  semantic_classifier_class_weight: mild
  semantic_classifier_logit_adjustment: 0.0
  attribute_classifier_weight: 0.3
  attribute_classifier_fields:
    - path_richness
  attribute_classifier_class_weight: balanced
  attribute_classifier_logit_adjustment: 0.25
  semantic_key_mode: coarse_k
  aux_regression_weight: 0.02
  first_path_power_bin_classifier_weight: 0.05
  first_path_power_bin_position_weight: 0.1
  aux_regression_targets:
    - delay_spread_ns
    - azimuth_spread_deg
    - first_path_delay_ns
    - first_path_power_dbw
  multipositive_distance_threshold: 0.25
  multipositive_positive_mode: semantic_and_physics
  min_class_size: 5
  min_class_size_for_multipositive: 2
